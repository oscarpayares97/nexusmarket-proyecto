services:
  mysql-db:
    image: mysql:8.0
    container_name: nexusmarket-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexusmarket_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_USER: nexus_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexus_app_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  nexusmarket-app:
    build:
      context: ./nexusmarket
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./nexusmarket:/workspace
      - maven_cache:/root/.m2
    ports:
      - "${HOST_SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: "${DB_URL:-jdbc:mysql://mysql-db:3306/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      DB_USERNAME: ${DB_USERNAME:-nexus_app}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-nexus_app_password}}
      JWT_SECRET: ${JWT_SECRET:-NEXUSMARKET-ACADEMIC-SECRET-KEY-2026-HS256-OK}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SERVER_PORT: 8080
    depends_on:
      mysql-db:
        condition: service_healthy
    command: ["mvn", "-B", "spring-boot:run"]

volumes:
  mysql_data:
  maven_cache: