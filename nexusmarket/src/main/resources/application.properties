spring.application.name=nexusmarket
server.port=${SERVER_PORT:8080}

# MySQL: sin variables de entorno usa el MySQL de docker-compose en localhost
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza las tablas solo, a partir de las Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT. Este secreto por defecto es PUBLICO (esta en el repositorio): solo para el curso.
# Para cualquier uso real, define la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:NEXUSMARKET-ACADEMIC-SECRET-KEY-2026-HS256-OK}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}